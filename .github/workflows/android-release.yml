name: Android Signed APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-signed-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install API 36 and Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate signing Secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE" ] || { echo "Missing secret: ANDROID_KEYSTORE_BASE64"; exit 1; }
          [ -n "$STORE_PASSWORD" ] || { echo "Missing secret: ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "Missing secret: ANDROID_KEY_ALIAS"; exit 1; }
          [ -n "$KEY_PASSWORD" ] || { echo "Missing secret: ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Restore and validate temporary keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/meugiga-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/meugiga-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null

      - name: Tests, lint and signed APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/meugiga-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon clean testDebugUnitTest lintRelease assembleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/MeuGiga-0.1.3-release-signed.apk
          ls -lh dist/MeuGiga-0.1.3-release-signed.apk

      - name: Upload APK artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: MeuGiga-0.1.3-release-signed-apk
          path: dist/MeuGiga-0.1.3-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="meugiga-latest-build"
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG" \
            dist/MeuGiga-0.1.3-release-signed.apk \
            --title "MeuGiga 0.1.3 - Latest Build" \
            --notes "APK release assinado gerado automaticamente pelo GitHub Actions. Commit: $GITHUB_SHA" \
            --prerelease
